<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有機分子名称 特訓道場</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif;
  background:#eef2ff;
  background-image:
    radial-gradient(at 0% 0%, #dbeafe 0px, transparent 55%),
    radial-gradient(at 100% 0%, #fce7f3 0px, transparent 55%),
    radial-gradient(at 50% 100%, #d1fae5 0px, transparent 55%);
  background-attachment:fixed;
  min-height:100vh;color:#1e293b;padding:22px 14px 60px;
  -webkit-font-smoothing:antialiased;
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999;display:none;}
.wrap{max-width:880px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:pop .42s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}

.hero{text-align:center;margin-bottom:24px;}
.hero .icon{
  width:84px;height:84px;margin:0 auto 16px;border-radius:26px;
  background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);
  display:flex;align-items:center;justify-content:center;font-size:42px;
  box-shadow:0 16px 40px rgba(139,92,246,.42);
  animation:float 3.6s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.hero h1{font-size:27px;font-weight:900;letter-spacing:.5px;margin-bottom:8px;}
.hero p{font-size:14px;color:#64748b;line-height:1.75;}

.panel{background:#fff;border-radius:28px;padding:26px 24px;box-shadow:0 18px 55px rgba(79,70,229,.14);margin-bottom:20px;}
.panel-title{
  font-size:15px;font-weight:900;color:#1e293b;letter-spacing:.5px;
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.panel-title .tag{
  font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;
  background:#eef2ff;color:#6366f1;letter-spacing:.5px;
}
.panel-title .tag.learn{background:#fef3c7;color:#b45309;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.statbox{background:#f8faff;border-radius:18px;padding:16px 8px;text-align:center;border:1.5px solid #eef2ff;}
.statbox b{font-size:24px;font-weight:900;color:#6366f1;display:block;line-height:1.15;}
.statbox small{font-size:11px;color:#94a3b8;letter-spacing:.5px;}

.btn{
  width:100%;padding:17px;border:none;border-radius:18px;
  font-size:17px;font-weight:900;font-family:inherit;letter-spacing:.6px;
  cursor:pointer;transition:.2s;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 10px 28px rgba(99,102,241,.38);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(99,102,241,.48);}
.btn:active{transform:translateY(0);}

.btn-outline{
  width:100%;padding:16px;border:2px solid #c7d2fe;border-radius:18px;
  font-size:16px;font-weight:900;font-family:inherit;letter-spacing:.6px;
  cursor:pointer;transition:.2s;background:#fff;color:#4f46e5;
  margin-top:12px;
}
.btn-outline:hover{background:#f5f3ff;border-color:#a5b4fc;transform:translateY(-2px);}

.btn-learn{
  width:100%;padding:16px;border:2px solid #fbbf24;border-radius:18px;
  font-size:16px;font-weight:900;font-family:inherit;letter-spacing:.6px;
  cursor:pointer;transition:.2s;background:#fffbeb;color:#b45309;
}
.btn-learn:hover{background:#fef3c7;border-color:#f59e0b;transform:translateY(-2px);}

.btn-sm{
  padding:10px 18px;border:none;border-radius:12px;font-size:14px;font-weight:900;
  font-family:inherit;cursor:pointer;transition:.2s;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 6px 18px rgba(99,102,241,.3);
}
.btn-sm:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.4);}
.btn-sm.gray{background:#e2e8f0;color:#475569;box-shadow:none;}
.btn-sm.gray:hover{background:#cbd5e1;transform:none;}

.tips{margin-top:16px;font-size:12.5px;color:#94a3b8;line-height:1.9;text-align:center;}
.tips b{color:#6366f1;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.topbar .left{display:flex;align-items:center;gap:12px;}
.backbtn{
  width:42px;height:42px;border-radius:14px;border:1.5px solid #e0e7ff;
  background:#fff;color:#6366f1;font-size:18px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.backbtn:hover{background:#f1f5ff;transform:translateX(-2px);}
.qmeta{font-size:15px;font-weight:800;color:#334155;}
.qmeta small{display:block;font-size:11.5px;color:#94a3b8;font-weight:600;margin-top:2px;}
.scorechip{background:#fff;border-radius:15px;padding:8px 20px;text-align:center;box-shadow:0 6px 20px rgba(99,102,241,.13);}
.scorechip b{font-size:20px;color:#6366f1;line-height:1.1;display:block;}
.scorechip small{font-size:10px;color:#94a3b8;letter-spacing:1px;}

.progresswrap{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.progress{flex:1;height:10px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);}
#bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);transition:width .45s cubic-bezier(.4,0,.2,1);}
#pct{font-size:12px;font-weight:800;color:#818cf8;min-width:42px;text-align:right;}

.card{background:#fff;border-radius:28px;padding:30px 26px 26px;box-shadow:0 18px 55px rgba(79,70,229,.14);}

.qtag{
  display:inline-block;font-size:12px;font-weight:800;padding:5px 14px;
  border-radius:99px;letter-spacing:.5px;margin-bottom:16px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,.3);
}
.qtag.pick{background:linear-gradient(135deg,#0ea5e9,#06b6d4);box-shadow:0 4px 12px rgba(14,165,233,.3);}

.prompt{font-size:15px;font-weight:800;color:#64748b;margin-bottom:14px;letter-spacing:.3px;}

.structbox{
  background:linear-gradient(135deg,#f8faff,#f1f5ff);
  border-radius:22px;padding:22px 16px;margin-bottom:22px;
  display:flex;align-items:center;justify-content:center;
  min-height:150px;border:2px solid #eef2ff;
}
.struct-svg{width:100%;max-width:340px;height:auto;display:block;}

.options{display:flex;flex-direction:column;gap:11px;}
.options.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}

.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 18px;border-radius:17px;border:2px solid #edf0fa;
  background:#fafbff;color:#1e293b;font-size:16px;line-height:1.65;
  font-family:inherit;font-weight:700;cursor:pointer;
  transition:.18s cubic-bezier(.4,0,.2,1);
}
.opt .num{
  flex:none;width:28px;height:28px;border-radius:50%;
  background:#eef2ff;color:#6366f1;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.opt:not(:disabled):hover{border-color:#a5b4fc;background:#fff;transform:translateY(-2px);box-shadow:0 10px 26px rgba(99,102,241,.17);}
.opt:not(:disabled):hover .num{background:#6366f1;color:#fff;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:#34d399;background:linear-gradient(135deg,#ecfdf5,#d1fae5);box-shadow:0 8px 22px rgba(16,185,129,.22);}
.opt.correct .num{background:#10b981;color:#fff;}
.opt.wrong{border-color:#f87171;background:linear-gradient(135deg,#fef2f2,#fee2e2);animation:shake .42s;}
.opt.wrong .num{background:#ef4444;color:#fff;}
.opt.dim{opacity:.45;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

.sopt{
  background:#fafbff;border:2px solid #edf0fa;border-radius:20px;
  padding:20px 14px;cursor:pointer;transition:.18s;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  position:relative;min-height:200px;justify-content:center;
}
.sopt:not(:disabled):hover{border-color:#a5b4fc;background:#fff;transform:translateY(-3px);box-shadow:0 10px 26px rgba(99,102,241,.18);}
.sopt:disabled{cursor:default;}
.sopt .snum{
  position:absolute;top:10px;left:12px;width:26px;height:26px;border-radius:50%;
  background:#eef2ff;color:#6366f1;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.sopt.correct{border-color:#34d399;background:linear-gradient(135deg,#ecfdf5,#d1fae5);box-shadow:0 8px 22px rgba(16,185,129,.22);}
.sopt.correct .snum{background:#10b981;color:#fff;}
.sopt.wrong{border-color:#f87171;background:linear-gradient(135deg,#fef2f2,#fee2e2);animation:shake .42s;}
.sopt.wrong .snum{background:#ef4444;color:#fff;}
.sopt.dim{opacity:.42;}
.sopt .struct-svg{max-width:100%;width:100%;max-height:150px;height:auto;}

.feedback{margin-top:20px;padding:20px;border-radius:20px;animation:pop .36s cubic-bezier(.34,1.56,.64,1);}
.feedback.ok{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:1.5px solid #a7f3d0;}
.feedback.no{background:linear-gradient(135deg,#fff7ed,#fef2f2);border:1.5px solid #fed7aa;}
.fb-title{font-size:17px;font-weight:900;margin-bottom:10px;}
.feedback.ok .fb-title{color:#059669;}
.feedback.no .fb-title{color:#ea580c;}
.fb-body{font-size:14.5px;line-height:1.95;color:#334155;}
.fb-body b{color:#4f46e5;}
.fb-body .row{display:flex;gap:8px;margin-top:6px;align-items:flex-start;}
.fb-body .lbl{flex:none;font-weight:900;color:#64748b;font-size:13px;}
.nextbtn{
  margin-top:16px;width:100%;padding:16px;border:none;border-radius:17px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  font-size:16px;font-weight:900;font-family:inherit;letter-spacing:.5px;
  cursor:pointer;transition:.2s;box-shadow:0 8px 24px rgba(99,102,241,.36);
}
.nextbtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(99,102,241,.46);}

.result{text-align:center;padding:14px 4px;}
.result .emoji{font-size:74px;line-height:1;margin-bottom:10px;animation:bounce .95s;}
@keyframes bounce{0%{transform:scale(.25) rotate(-20deg);opacity:0;}60%{transform:scale(1.18) rotate(6deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
.result h2{font-size:26px;font-weight:900;margin-bottom:6px;}
.title-badge{
  display:inline-block;margin:12px 0 18px;padding:10px 26px;border-radius:99px;
  font-size:17px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b,#ec4899);
  color:#fff;box-shadow:0 10px 28px rgba(245,158,11,.42);
  animation:glow 1.8s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 10px 28px rgba(245,158,11,.42);}50%{box-shadow:0 14px 40px rgba(236,72,153,.55);}}
.result .sub{color:#64748b;font-size:14px;margin-bottom:20px;line-height:1.8;}
.ring{position:relative;width:180px;height:180px;margin:0 auto 18px;}
.ring svg{transform:rotate(-90deg);}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bignum{
  font-size:56px;font-weight:900;line-height:1.05;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.bignum small{font-size:22px;color:#94a3b8;-webkit-text-fill-color:#94a3b8;}

.review{margin-top:24px;text-align:left;background:#f8faff;border-radius:20px;padding:20px;}
.review h3{font-size:14px;color:#64748b;margin-bottom:14px;letter-spacing:.5px;font-weight:900;}
.review .item{
  display:flex;gap:11px;font-size:14px;padding:11px 0;
  border-bottom:1px dashed #e2e8f0;line-height:1.7;align-items:flex-start;
}
.review .item:last-child{border-bottom:none;}
.review .tag{flex:none;background:#eef2ff;color:#6366f1;font-weight:900;font-size:12px;padding:3px 10px;border-radius:8px;}
.again-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center;}
.again{
  flex:1;min-width:160px;padding:16px;border:none;border-radius:17px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;
  box-shadow:0 10px 28px rgba(99,102,241,.36);transition:.2s;
}
.again:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(99,102,241,.46);}
.again.home{
  background:#fff;color:#4f46e5;border:2px solid #c7d2fe;box-shadow:none;
}
.again.home:hover{background:#f5f3ff;box-shadow:0 6px 18px rgba(99,102,241,.15);}

.browse-section{margin-bottom:32px;}
.browse-section h3{
  font-size:14px;font-weight:900;color:#4f46e5;letter-spacing:.8px;
  margin-bottom:14px;padding-bottom:8px;
  border-bottom:2px solid #e0e7ff;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.browse-section h3 label{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:#64748b;cursor:pointer;margin-left:auto;
}
.browse-section h3 input[type=checkbox]{width:16px;height:16px;accent-color:#6366f1;cursor:pointer;}
.browse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.browse-card{
  background:#f8faff;border:1.5px solid #eef2ff;border-radius:16px;
  padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:.18s;position:relative;
}
.browse-card:hover{border-color:#c7d2fe;background:#fff;box-shadow:0 6px 20px rgba(99,102,241,.1);}
.browse-card.selected{border-color:#6366f1;background:#eef2ff;box-shadow:0 6px 20px rgba(99,102,241,.2);}
.browse-card .b-check{
  position:absolute;top:8px;left:10px;width:18px;height:18px;
  accent-color:#6366f1;cursor:pointer;
}
.browse-card .b-svg{
  width:100%;display:flex;align-items:center;justify-content:center;
  min-height:100px;
}
.browse-card .b-svg .struct-svg{max-width:100%;max-height:130px;}
.browse-card .b-jp{
  font-size:13.5px;font-weight:900;color:#1e293b;text-align:center;
  line-height:1.4;word-break:break-word;
}
.browse-card .b-cn{
  font-size:11.5px;color:#94a3b8;text-align:center;font-weight:600;
}
.browse-actions{
  position:sticky;bottom:16px;margin-top:28px;z-index:10;
  display:flex;gap:12px;flex-wrap:wrap;
}
.browse-actions .btn{flex:1;min-width:200px;}

@media (max-width:640px){
  body{padding:14px 10px 44px;}
  .card{padding:24px 16px 22px;border-radius:22px;}
  .panel{padding:22px 16px;border-radius:22px;}
  .options.grid4{grid-template-columns:repeat(1,1fr);}
  .browse-grid{grid-template-columns:repeat(1,1fr);}
  .hero h1{font-size:23px;}
  .statgrid{gap:8px;}
  .statbox b{font-size:20px;}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">

  <!-- ========== 开始页 ========== -->
  <section id="v-start" class="view active">
    <div class="hero">
      <div class="icon">🧬</div>
      <h1>有機分子名称 特訓道場</h1>
      <p>構造式 ↔ 名称 を 10 問でチェック<br>7 点以上で特別称号ゲット！</p>
    </div>

    <div class="panel">
      <div class="statgrid">
        <div class="statbox"><b id="dbCount">0</b><small>収録分子</small></div>
        <div class="statbox"><b id="basicCount">0</b><small>基礎版</small></div>
        <div class="statbox"><b>10</b><small>最大出題数</small></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span class="tag">試験</span>
        <span>テストモード</span>
      </div>
      <button class="btn" id="startAllBtn">📚 全部単語で特訓スタート</button>
      <button class="btn-outline" id="startBasicBtn">📘 基礎版で特訓スタート</button>
      <button class="btn-outline" id="selectRangeBtn">🎯 範囲を選んで特訓する</button>
      <p class="tips">
        出題形式：<b>構造 → 名称（選択）</b> / <b>名称 → 構造（8択）</b>
      </p>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span class="tag learn">学習</span>
        <span>単語カタログ</span>
      </div>
      <button class="btn-learn" id="browseBtn">📖 構造式と名前を全部見る</button>
      <p class="tips">
        試験の前に、すべての分子の構造式・日本語名・中国語名を確認できます。
      </p>
    </div>
  </section>

  <!-- ========== 浏览页 ========== -->
  <section id="v-browse" class="view">
    <div class="topbar">
      <div class="left">
        <button class="backbtn" id="browseBackBtn">←</button>
        <div class="qmeta" id="browseTitle">📖 分子カタログ<small id="browseCount">全 0 分子</small></div>
      </div>
      <div id="browseTools" style="display:flex;gap:8px;align-items:center;"></div>
    </div>
    <div class="card" id="browseCard"></div>
  </section>

  <!-- ========== 答题页 ========== -->
  <section id="v-quiz" class="view">
    <div class="topbar">
      <div class="left">
        <button class="backbtn" id="backBtn">←</button>
        <div class="qmeta" id="qMeta">第 1 問<small>全 10 問</small></div>
      </div>
      <div class="scorechip"><b id="scoreNum">0</b><small>SCORE</small></div>
    </div>

    <div class="progresswrap">
      <div class="progress"><div id="bar"></div></div>
      <span id="pct">0%</span>
    </div>

    <div class="card" id="quizCard"></div>
  </section>

  <!-- ========== 结果页 ========== -->
  <section id="v-result" class="view">
    <div class="card" id="resultCard"></div>
  </section>

</div>

<script>
/* =====================================================================
   SVG 基础工具
   ===================================================================== */
function svgLine(x1, y1, x2, y2, w = 2.4){
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1e293b" stroke-width="${w}" stroke-linecap="round"/>`;
}

function svgDbl(x1, y1, x2, y2, off = 4.5, w = 2.4){
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const px = -(y2 - y1) / len * off;
  const py =  (x2 - x1) / len * off;
  return svgLine(x1, y1, x2, y2, w) +
         svgLine(x1 + px, y1 + py, x2 + px, y2 + py, w);
}

function svgDblTo(x1, y1, x2, y2, cx, cy, off = 4.5, w = 2.4){
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = cx - mx, dy = cy - my;
  const len = Math.hypot(dx, dy) || 1;
  const px = dx / len * off, py = dy / len * off;
  return svgLine(x1, y1, x2, y2, w) +
         svgLine(x1 + px, y1 + py, x2 + px, y2 + py, w);
}

function svgTpl(x1, y1, x2, y2, off = 4, w = 2.2){
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const px = -(y2 - y1) / len * off;
  const py =  (x2 - x1) / len * off;
  return svgLine(x1, y1, x2, y2, w) +
         svgLine(x1 + px, y1 + py, x2 + px, y2 + py, w) +
         svgLine(x1 - px, y1 - py, x2 - px, y2 - py, w);
}

function svgTxt(x, y, text, opts = {}){
  const { anchor = 'middle', size = 15, weight = 800, baseline = 'middle' } = opts;
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="${baseline}" font-size="${size}" font-weight="${weight}" fill="#1e293b" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">${text}</text>`;
}

function svgWrap(inner, w = 340, h = 180){
  return `<svg viewBox="0 0 ${w} ${h}" class="struct-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}

/* =====================================================================
   纯文本结构式
   ===================================================================== */
function textFormula(str){
  const len = str.length;
  let fs = 22;
  if (len > 12) fs = 18;
  if (len > 18) fs = 15;
  if (len > 26) fs = 12;
  if (len > 34) fs = 10;
  return svgWrap(svgTxt(170, 90, str, { size: fs }));
}

/* =====================================================================
   锯齿形链状骨架
   ===================================================================== */
function zigzag(n, opts = {}){
  const { doubleBond = -1, tripleBond = -1, subs = {}, endLabels = true } = opts;
  const bl = 28;
  const hasTriple = tripleBond >= 0;

  const dirs = [];
  for (let i = 0; i < n - 1; i++){
    if (i === 0){
      dirs[i] = hasTriple ? 0 : -30;
    } else if (i === tripleBond || i - 1 === tripleBond){
      dirs[i] = dirs[i - 1];
    } else {
      dirs[i] = dirs[i - 1] === -30 ? 30 : -30;
    }
  }

  const pts = [[0, 0]];
  for (let i = 0; i < n - 1; i++){
    const a = dirs[i] * Math.PI / 180;
    pts.push([pts[i][0] + bl * Math.cos(a), pts[i][1] + bl * Math.sin(a)]);
  }

  const xs = pts.map(p => p[0]);
  const ys = pts.map(p => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const ox = 170 - cx, oy = 90 - cy;
  for (const p of pts){ p[0] += ox; p[1] += oy; }

  let s = '';
  for (let i = 0; i < n - 1; i++){
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    if (i === tripleBond)      s += svgTpl(x1, y1, x2, y2);
    else if (i === doubleBond) s += svgDbl(x1, y1, x2, y2);
    else                       s += svgLine(x1, y1, x2, y2);
  }

  if (endLabels && n >= 2 && subs[0] === undefined){
    const [x0, y0] = pts[0], [x1, y1] = pts[1];
    const ddx = x0 - x1, ddy = y0 - y1;
    const dl = Math.hypot(ddx, ddy) || 1;
    s += svgTxt(x0 + ddx / dl * 16, y0 + ddy / dl * 16, 'CH₃');
  }
  if (endLabels && n >= 2 && subs[n - 1] === undefined){
    const [xn, yn] = pts[n - 1], [xp, yp] = pts[n - 2];
    const ddx = xn - xp, ddy = yn - yp;
    const dl = Math.hypot(ddx, ddy) || 1;
    s += svgTxt(xn + ddx / dl * 16, yn + ddy / dl * 16, 'CH₃');
  }

  for (const [idx, info] of Object.entries(subs)){
    const i = parseInt(idx);
    const [x, y] = pts[i];
    let vx = 0, vy = -1;
    const dir = info.dir || 'up';
    if (dir === 'up')             { vx =  0;   vy = -1;   }
    else if (dir === 'down')      { vx =  0;   vy =  1;   }
    else if (dir === 'upleft')    { vx = -0.7; vy = -0.7; }
    else if (dir === 'upright')   { vx =  0.7; vy = -0.7; }
    else if (dir === 'downleft')  { vx = -0.7; vy =  0.7; }
    else if (dir === 'downright') { vx =  0.7; vy =  0.7; }
    else if (dir === 'left')      { vx = -1;   vy =  0;   }
    else if (dir === 'right')     { vx =  1;   vy =  0;   }
    const ex = x + vx * 18, ey = y + vy * 18;
    s += svgLine(x, y, ex, ey);
    const tx = ex + vx * 8, ty = ey + vy * 8;
    const anchor = vx > 0.3 ? 'start' : vx < -0.3 ? 'end' : 'middle';
    s += svgTxt(tx, ty, info.text, { anchor });
  }

  return svgWrap(s);
}

/* =====================================================================
   环烷烃
   ===================================================================== */
function cycloRing(n){
  const cx = 170, cy = 90, r = 42;
  const pts = [];
  for (let i = 0; i < n; i++){
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  let s = '';
  for (let i = 0; i < n; i++){
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
    s += svgLine(x1, y1, x2, y2);
  }
  return svgWrap(s);
}

/* =====================================================================
   苯环上的 C=O 取代基
   ===================================================================== */
function drawCarbonylSubst(x, y, dx, dy, type){
  let s = '';
  const signX = dx > 0 ? 1 : -1;
  const cos30 = 0.866, sin30 = 0.5;

  if (type === 'OCOCH₃'){
    const O1x = x + dx * 20, O1y = y + dy * 20;
    s += svgLine(x, y, O1x, O1y);
    s += svgTxt(O1x + dx * 11, O1y + dy * 11, 'O', { size: 15 });

    const ocx = signX * cos30, ocy = sin30;
    const Cx = O1x + ocx * 24, Cy = O1y + ocy * 24;
    s += svgLine(O1x, O1y, Cx, Cy);

    const cox = 0, coy = 1;
    const Ox = Cx + cox * 24, Oy = Cy + coy * 24;
    s += svgDbl(Cx, Cy, Ox, Oy);
    s += svgTxt(Ox + cox * 12, Oy + coy * 12, 'O', { size: 15 });

    const chx = signX * cos30, chy = -sin30;
    const CHx = Cx + chx * 26, CHy = Cy + chy * 26;
    s += svgLine(Cx, Cy, CHx, CHy);
    s += svgTxt(CHx + chx * 14, CHy + chy * 14, 'CH₃', { size: 13 });
    return s;
  }

  const Cx = x + dx * 20, Cy = y + dy * 20;
  s += svgLine(x, y, Cx, Cy);

  const cox = 0, coy = -1;
  const Ox = Cx + cox * 24, Oy = Cy + coy * 24;
  s += svgDbl(Cx, Cy, Ox, Oy);
  s += svgTxt(Ox + cox * 12, Oy + coy * 12, 'O', { size: 15 });

  const rx = signX * cos30, ry = sin30;

  if (type === 'COOH'){
    const Rx = Cx + rx * 26, Ry = Cy + ry * 26;
    s += svgLine(Cx, Cy, Rx, Ry);
    s += svgTxt(Rx + rx * 14, Ry + ry * 14, 'OH', { size: 14 });
  } else if (type === 'CHO'){
    const Rx = Cx + rx * 26, Ry = Cy + ry * 26;
    s += svgLine(Cx, Cy, Rx, Ry);
    s += svgTxt(Rx + rx * 14, Ry + ry * 14, 'H', { size: 15 });
  } else if (type === 'COCH₃'){
    const Rx = Cx + rx * 26, Ry = Cy + ry * 26;
    s += svgLine(Cx, Cy, Rx, Ry);
    s += svgTxt(Rx + rx * 14, Ry + ry * 14, 'CH₃', { size: 13 });
  } else if (type === 'COOCH₃' || type === 'COOC₂H₅'){
    const Ox2 = Cx + rx * 24, Oy2 = Cy + ry * 24;
    s += svgLine(Cx, Cy, Ox2, Oy2);
    s += svgTxt(Ox2 + rx * 11, Oy2 + ry * 11, 'O', { size: 15 });

    const R2x = Ox2 + rx * 22, R2y = Oy2 + ry * 22;
    s += svgLine(Ox2, Oy2, R2x, R2y);
    const label = type === 'COOCH₃' ? 'CH₃' : 'C₂H₅';
    s += svgTxt(R2x + rx * 14, R2y + ry * 14, label, { size: 13 });
  }
  return s;
}

/* =====================================================================
   苯环（凯库勒式）
   ===================================================================== */
function benzene(subs = {}){
  const cx = 170, cy = 95, r = 40;
  const s3 = Math.sqrt(3);
  const V = [
    [cx + r,               cy                  ],
    [cx + r / 2,           cy - r * s3 / 2     ],
    [cx - r / 2,           cy - r * s3 / 2     ],
    [cx - r,               cy                  ],
    [cx - r / 2,           cy + r * s3 / 2     ],
    [cx + r / 2,           cy + r * s3 / 2     ]
  ];
  const bonds = [[0,1,2],[1,2,1],[2,3,2],[3,4,1],[4,5,2],[5,0,1]];
  let s = '';
  for (const [a, b, ord] of bonds){
    const [x1, y1] = V[a], [x2, y2] = V[b];
    if (ord === 2) s += svgDblTo(x1, y1, x2, y2, cx, cy, 4.5);
    else           s += svgLine(x1, y1, x2, y2);
  }

  const posMap = { R: 0, TR: 1, TL: 2, L: 3, BL: 4, BR: 5 };
  const carbonylTypes = ['COOH','COOCH₃','COOC₂H₅','OCOCH₃','CHO','COCH₃'];

  for (const [k, subText] of Object.entries(subs)){
    if (!subText) continue;
    const idx = posMap[k];
    if (idx === undefined) continue;
    const [vx0, vy0] = V[idx];
    const dx = (vx0 - cx) / r, dy = (vy0 - cy) / r;

    if (carbonylTypes.includes(subText)){
      s += drawCarbonylSubst(vx0, vy0, dx, dy, subText);
      continue;
    }

    const ex = vx0 + dx * 22, ey = vy0 + dy * 22;
    s += svgLine(vx0, vy0, ex, ey);
    const tx = ex + dx * 12, ty = ey + dy * 12;
    const anchor = dx > 0.3 ? 'start' : dx < -0.3 ? 'end' : 'middle';
    s += svgTxt(tx, ty, subText, { anchor });
  }
  return svgWrap(s);
}

/* =====================================================================
   萘环（凯库勒式）
   ===================================================================== */
function naphthalene(subs = {}){
  const cx = 170, cy = 90, r = 24;
  const s3 = Math.sqrt(3);
  const rh = r / 2;
  const rw = r * s3 / 2;

  const ST = [cx, cy - rh];
  const SB = [cx, cy + rh];
  const Lt = [cx - rw, cy - r];
  const Llt = [cx - r * s3, cy - rh];
  const Llb = [cx - r * s3, cy + rh];
  const Lb = [cx - rw, cy + r];
  const Rt = [cx + rw, cy - r];
  const Rrt = [cx + r * s3, cy - rh];
  const Rrb = [cx + r * s3, cy + rh];
  const Rb = [cx + rw, cy + r];

  const leftCtr = [cx - rw, cy];
  const rightCtr = [cx + rw, cy];

  let s = '';
  s += svgDblTo(ST[0], ST[1], Lt[0], Lt[1], leftCtr[0], leftCtr[1], 4);
  s += svgLine(Lt[0], Lt[1], Llt[0], Llt[1]);
  s += svgDblTo(Llt[0], Llt[1], Llb[0], Llb[1], leftCtr[0], leftCtr[1], 4);
  s += svgLine(Llb[0], Llb[1], Lb[0], Lb[1]);
  s += svgDblTo(Lb[0], Lb[1], SB[0], SB[1], leftCtr[0], leftCtr[1], 4);
  s += svgLine(SB[0], SB[1], ST[0], ST[1]);

  s += svgLine(ST[0], ST[1], Rt[0], Rt[1]);
  s += svgDblTo(Rt[0], Rt[1], Rrt[0], Rrt[1], rightCtr[0], rightCtr[1], 4);
  s += svgLine(Rrt[0], Rrt[1], Rrb[0], Rrb[1]);
  s += svgDblTo(Rrb[0], Rrb[1], Rb[0], Rb[1], rightCtr[0], rightCtr[1], 4);
  s += svgLine(Rb[0], Rb[1], SB[0], SB[1]);

  const posMap = {
    Lt:  { pos: Lt,  center: leftCtr  },
    Llt: { pos: Llt, center: leftCtr  },
    Llb: { pos: Llb, center: leftCtr  },
    Lb:  { pos: Lb,  center: leftCtr  },
    Rt:  { pos: Rt,  center: rightCtr },
    Rrt: { pos: Rrt, center: rightCtr },
    Rrb: { pos: Rrb, center: rightCtr },
    Rb:  { pos: Rb,  center: rightCtr }
  };

  for (const [k, subText] of Object.entries(subs)){
    if (!subText) continue;
    const info = posMap[k];
    if (!info) continue;
    const [vx0, vy0] = info.pos;
    const [ccx, ccy] = info.center;
    let dx = vx0 - ccx, dy = vy0 - ccy;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const ex = vx0 + dx * 22, ey = vy0 + dy * 22;
    s += svgLine(vx0, vy0, ex, ey);
    const tx = ex + dx * 12, ty = ey + dy * 12;
    const anchor = dx > 0.3 ? 'start' : dx < -0.3 ? 'end' : 'middle';
    s += svgTxt(tx, ty, subText, { anchor, size: 14 });
  }
  return svgWrap(s);
}

/* =====================================================================
   特定分子
   ===================================================================== */
function isobutane(){
  const cx = 170, cy = 95, r = 38;
  let s = '';
  const targets = [
    [cx - r * 0.85, cy - r * 0.55],
    [cx + r * 0.85, cy - r * 0.55],
    [cx,            cy + r * 0.85]
  ];
  for (const [ex, ey] of targets){
    s += svgLine(cx, cy, ex, ey);
    const dx = ex - cx, dy = ey - cy;
    const len = Math.hypot(dx, dy) || 1;
    const tx = ex + dx / len * 16, ty = ey + dy / len * 16;
    const anchor = Math.abs(dx) < 0.3 ? 'middle' : (dx > 0 ? 'start' : 'end');
    s += svgTxt(tx, ty, 'CH₃', { anchor });
  }
  return svgWrap(s);
}

function isobutylene(){
  const c1x = 135, c2x = 185, cy = 90;
  let s = svgDbl(c1x, cy, c2x, cy);
  s += svgLine(c1x, cy, c1x - 28, cy - 20);
  s += svgLine(c1x, cy, c1x - 28, cy + 20);
  s += svgTxt(c1x - 38, cy - 26, 'CH₂', { anchor: 'end' });
  s += svgTxt(c1x - 38, cy + 26, 'H',   { anchor: 'end' });
  s += svgLine(c2x, cy, c2x + 12, cy - 26);
  s += svgLine(c2x, cy, c2x + 12, cy + 26);
  s += svgTxt(c2x + 26, cy - 32, 'CH₃', { anchor: 'start' });
  s += svgTxt(c2x + 26, cy + 32, 'CH₃', { anchor: 'start' });
  return svgWrap(s);
}

function butene2(cis){
  const c1x = 135, c2x = 185, cy = 90;
  let s = svgDbl(c1x, cy, c2x, cy);
  const bl = 24;
  if (cis){
    s += svgLine(c1x, cy, c1x - 22, cy - bl);
    s += svgLine(c1x, cy, c1x - 22, cy + bl);
    s += svgTxt(c1x - 32, cy - bl - 4, 'CH₃', { anchor: 'end' });
    s += svgTxt(c1x - 32, cy + bl + 4, 'H',   { anchor: 'end' });
    s += svgLine(c2x, cy, c2x + 22, cy - bl);
    s += svgLine(c2x, cy, c2x + 22, cy + bl);
    s += svgTxt(c2x + 32, cy - bl - 4, 'CH₃', { anchor: 'start' });
    s += svgTxt(c2x + 32, cy + bl + 4, 'H',   { anchor: 'start' });
    s += svgTxt(170, cy + 60, 'cis', { size: 13, anchor: 'middle' });
  } else {
    s += svgLine(c1x, cy, c1x - 22, cy - bl);
    s += svgLine(c1x, cy, c1x - 22, cy + bl);
    s += svgTxt(c1x - 32, cy - bl - 4, 'CH₃', { anchor: 'end' });
    s += svgTxt(c1x - 32, cy + bl + 4, 'H',   { anchor: 'end' });
    s += svgLine(c2x, cy, c2x + 22, cy - bl);
    s += svgLine(c2x, cy, c2x + 22, cy + bl);
    s += svgTxt(c2x + 32, cy - bl - 4, 'H',   { anchor: 'start' });
    s += svgTxt(c2x + 32, cy + bl + 4, 'CH₃', { anchor: 'start' });
    s += svgTxt(170, cy + 60, 'trans', { size: 13, anchor: 'middle' });
  }
  return svgWrap(s);
}

function maleicAcid(){
  const c1x = 135, c2x = 185, cy = 90;
  let s = svgDbl(c1x, cy, c2x, cy);
  const bl = 26;
  s += svgLine(c1x, cy, c1x - 20, cy - bl);
  s += svgLine(c1x, cy, c1x - 20, cy + bl);
  s += svgTxt(c1x - 28, cy - bl - 4, 'COOH', { anchor: 'end', size: 13 });
  s += svgTxt(c1x - 28, cy + bl + 4, 'H',   { anchor: 'end' });
  s += svgLine(c2x, cy, c2x + 20, cy - bl);
  s += svgLine(c2x, cy, c2x + 20, cy + bl);
  s += svgTxt(c2x + 28, cy - bl - 4, 'COOH', { anchor: 'start', size: 13 });
  s += svgTxt(c2x + 28, cy + bl + 4, 'H',   { anchor: 'start' });
  s += svgTxt(170, cy + 62, 'cis', { size: 13, anchor: 'middle' });
  return svgWrap(s);
}

function fumaricAcid(){
  const c1x = 135, c2x = 185, cy = 90;
  let s = svgDbl(c1x, cy, c2x, cy);
  const bl = 26;
  s += svgLine(c1x, cy, c1x - 20, cy - bl);
  s += svgLine(c1x, cy, c1x - 20, cy + bl);
  s += svgTxt(c1x - 28, cy - bl - 4, 'COOH', { anchor: 'end', size: 13 });
  s += svgTxt(c1x - 28, cy + bl + 4, 'H',   { anchor: 'end' });
  s += svgLine(c2x, cy, c2x + 20, cy - bl);
  s += svgLine(c2x, cy, c2x + 20, cy + bl);
  s += svgTxt(c2x + 28, cy - bl - 4, 'H',   { anchor: 'start' });
  s += svgTxt(c2x + 28, cy + bl + 4, 'COOH', { anchor: 'start', size: 13 });
  s += svgTxt(170, cy + 62, 'trans', { size: 13, anchor: 'middle' });
  return svgWrap(s);
}

let selectedIndices = new Set();

function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr, n, exclude){
  const pool = arr.filter(x => !exclude || !exclude.includes(x));
  return shuffle(pool).slice(0, n);
}

/* =====================================================================
   浏览页渲染
   ===================================================================== */
function renderBrowse(){
  const groups = {};
  for (const m of DB){
    const g = m.g || 'その他';
    if (!groups[g]) groups[g] = [];
    groups[g].push(m);
  }

  const isSelect = browseMode === 'select';
  $('browseTitle').innerHTML = isSelect
    ? '🎯 範囲を選ぶ<small id="browseCount">全 0 分子</small>'
    : '📖 分子カタログ<small id="browseCount">全 0 分子</small>';

  $('browseTools').innerHTML = isSelect
    ? `<button class="btn-sm" id="selectAllBtn">全選択</button>
       <button class="btn-sm gray" id="deselectAllBtn">全解除</button>`
    : '';

  let html = '';
  for (const [gName, list] of Object.entries(groups)){
    const groupIds = list.map(m => m.idx);
    const allChecked = isSelect && groupIds.every(id => selectedIndices.has(id));
    html += `<div class="browse-section" data-group="${gName}">
      <h3>📁 ${gName} <span style="color:#94a3b8;font-weight:600;font-size:12px;">(${list.length})</span>
        ${isSelect ? `<label><input type="checkbox" class="group-check" data-group="${gName}" ${allChecked ? 'checked' : ''}> 全選択</label>` : ''}
      </h3>
      <div class="browse-grid">`;
    for (const m of list){
      const checked = isSelect && selectedIndices.has(m.idx);
      const basicTag = m.level === 'basic'
        ? '<span style="display:inline-block;background:#dbeafe;color:#1e40af;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:4px;">基礎</span>'
        : '';
      html += `<div class="browse-card ${checked ? 'selected' : ''}" data-idx="${m.idx}">
        ${isSelect ? `<input type="checkbox" class="b-check" data-idx="${m.idx}" ${checked ? 'checked' : ''}>` : ''}
        <div class="b-svg">${m.s}</div>
        <div class="b-jp">${m.jp}${basicTag}</div>
        <div class="b-cn">${m.cn}</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (isSelect){
    html += `<div class="browse-actions">
      <button class="btn" id="browseStartBtn">✅ 選択した範囲で特訓スタート（<span id="selCount">${selectedIndices.size}</span> 分子）</button>
    </div>`;
  } else {
    html += `<div class="browse-actions">
      <button class="btn" id="browseStartAllBtn">▶ 全部単語で特訓スタート</button>
    </div>`;
  }

  $('browseCard').innerHTML = html;
  const bc = $('browseCount');
  if (bc) bc.textContent = `全 ${DB.length} 分子`;

  if (isSelect){
    document.querySelectorAll('.b-check').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        const card = e.target.closest('.browse-card');
        if (e.target.checked){
          selectedIndices.add(idx);
          card.classList.add('selected');
        } else {
          selectedIndices.delete(idx);
          card.classList.remove('selected');
        }
        $('selCount').textContent = selectedIndices.size;
        const groupName = card.closest('.browse-section').dataset.group;
        const groupCb = document.querySelector(`.group-check[data-group="${groupName}"]`);
        if (groupCb){
          const groupCards = card.closest('.browse-grid').querySelectorAll('.b-check');
          const all = Array.from(groupCards).every(c => c.checked);
          groupCb.checked = all;
        }
      });
    });

    document.querySelectorAll('.group-check').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const groupName = e.target.dataset.group;
        const section = document.querySelector(`.browse-section[data-group="${groupName}"]`);
        const cards = section.querySelectorAll('.browse-card');
        cards.forEach(card => {
          const idx = parseInt(card.dataset.idx);
          const check = card.querySelector('.b-check');
          check.checked = e.target.checked;
          if (e.target.checked){
            selectedIndices.add(idx);
            card.classList.add('selected');
          } else {
            selectedIndices.delete(idx);
            card.classList.remove('selected');
          }
        });
        $('selCount').textContent = selectedIndices.size;
      });
    });

    $('browseStartBtn').addEventListener('click', () => {
      if (selectedIndices.size === 0){
        alert('少なくとも 1 つの分子を選択してください。');
        return;
      }
      const pool = DB.filter(m => selectedIndices.has(m.idx));
      startQuizFromPool(pool);
    });

    const selAll = $('selectAllBtn');
    const deselAll = $('deselectAllBtn');
    if (selAll) selAll.addEventListener('click', () => {
      DB.forEach(m => selectedIndices.add(m.idx));
      renderBrowse();
    });
    if (deselAll) deselAll.addEventListener('click', () => {
      selectedIndices.clear();
      renderBrowse();
    });
  } else {
    $('browseStartAllBtn').addEventListener('click', () => startQuizFromPool(DB));
  }
}

/* =====================================================================
   出题
   ===================================================================== */
function buildQuiz(pool, totalQ){
  const shuffledPool = shuffle(pool).slice(0, totalQ);
  return shuffledPool.map(mol => {
    const r = Math.random();
    if (r < 0.62) return makeNameQuestion(mol, pool);
    return makeStructQuestion(mol, pool);
  });
}

function makeNameQuestion(mol, pool){
  const same = pool.filter(x => x.cat === mol.cat && x.jp !== mol.jp);
  const others = pick(same.length >= 3 ? same : pool.filter(x => x.jp !== mol.jp), 3, [mol]);
  const opts = shuffle([mol, ...others]);
  return { type: 'name', mol, opts, ans: opts.indexOf(mol) };
}

function makeStructQuestion(mol, pool){
  const same = pool.filter(x => x.cat === mol.cat && x.jp !== mol.jp);
  const others = pick(same.length >= 7 ? same : pool.filter(x => x.jp !== mol.jp), 7, [mol]);
  const opts = shuffle([mol, ...others]);
  return { type: 'struct', mol, opts, ans: opts.indexOf(mol) };
}

/* =====================================================================
   视图
   ===================================================================== */
function showView(v){
  document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
  $('v-' + v).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateHUD(){
  const p = Math.round(curIdx / TOTAL_Q * 100);
  $('bar').style.width = p + '%';
  $('pct').textContent = p + '%';
  $('scoreNum').textContent = score;
  $('qMeta').innerHTML = `第 ${curIdx + 1} 問<small>全 ${TOTAL_Q} 問</small>`;
}

function renderQuestion(){
  const q = quiz[curIdx];
  answered = false;
  updateHUD();

  const card = $('quizCard');
  let html = '';

  if (q.type === 'name'){
    html += `<span class="qtag">構造 → 名称</span>`;
    html += `<div class="prompt">この構造式の名称は？</div>`;
    html += `<div class="structbox">${q.mol.s}</div>`;
    html += `<div class="options" id="optBox">`;
    q.opts.forEach((o, i) => {
      html += `<button class="opt" data-i="${i}">
        <span class="num">${CIRC[i]}</span>
        <span class="txt">${o.jp}</span>
      </button>`;
    });
    html += `</div>`;
  } else {
    html += `<span class="qtag pick">名称 → 構造</span>`;
    html += `<div class="prompt">「${q.mol.jp}」の構造式はどれ？</div>`;
    html += `<div class="structbox" style="min-height:auto;padding:14px;background:none;border:none;">
      <div style="font-size:24px;font-weight:900;color:#4338ca;letter-spacing:1px;">${q.mol.jp}</div>
    </div>`;
    html += `<div class="options grid4" id="optBox">`;
    q.opts.forEach((o, i) => {
      html += `<button class="sopt" data-i="${i}">
        <span class="snum">${i + 1}</span>
        ${o.s}
      </button>`;
    });
    html += `</div>`;
  }

  html += `<div id="fbArea"></div>`;
  card.innerHTML = html;

  card.querySelectorAll('.opt, .sopt').forEach(btn => {
    btn.addEventListener('click', () => submitChoice(parseInt(btn.dataset.i, 10)));
  });

  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'pop .42s cubic-bezier(.34,1.56,.64,1)';
}

/* =====================================================================
   判题
   ===================================================================== */
function submitChoice(i){
  if (answered) return;
  answered = true;

  const q = quiz[curIdx];
  const correct = (i === q.ans);
  const btns = document.querySelectorAll('#optBox > button');

  btns.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.ans) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  finishQuestion(correct, q);
}

function finishQuestion(correct, q){
  if (correct){
    score++;
    $('scoreNum').textContent = score;
  } else {
    wrongList.push({ idx: curIdx + 1, jp: q.mol.jp, cn: q.mol.cn });
  }

  const isLast = (curIdx === TOTAL_Q - 1);
  let html = `<div class="feedback ${correct ? 'ok' : 'no'}">
    <div class="fb-title">${correct ? '🎉 正解！' : '❌ 残念…'}</div>
    <div class="fb-body">`;

  html += `<div class="row"><span class="lbl">日文</span><span><b>${q.mol.jp}</b></span></div>`;
  html += `<div class="row"><span class="lbl">中文</span><span>${q.mol.cn}</span></div>`;
  html += `<div class="row" style="margin-top:10px;"><span class="lbl">構造</span><span style="flex:1;">${q.mol.s}</span></div>`;

  html += `</div>
    <button class="nextbtn" id="nextBtn">${isLast ? '🏁 結果を見る' : '次の問題 →'}</button>
  </div>`;

  $('fbArea').innerHTML = html;

  $('nextBtn').addEventListener('click', () => {
    if (isLast) showResult();
    else {
      curIdx++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  $('fbArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* =====================================================================
   结果页
   ===================================================================== */
const TITLES = [
  {min:10, name:'有機化学の神様', emoji:'👑', msg:'全問正解！もはや教科書より正確です。'},
  {min:9,  name:'有機マスター',   emoji:'🏆', msg:'あと一歩で完璧！素晴らしい実力です。'},
  {min:8,  name:'合成の匠',       emoji:'💎', msg:'見事な成績！命名のセンスが光っています。'},
  {min:7,  name:'官能基ハンター', emoji:'⭐', msg:'合格ライン突破！この調子で覚えていこう。'},
  {min:0,  name:'再挑戦の戦士',   emoji:'🥲', msg:'もう一度チャレンジして、称号を手に入れよう！'}
];

function showResult(){
  $('bar').style.width = '100%';
  $('pct').textContent = '100%';

  const rate = Math.round(score / TOTAL_Q * 100);
  const t = TITLES.find(x => score >= x.min);
  const passed = score >= PASS;

  const R = 72, C = 2 * Math.PI * R;
  const dash = C * rate / 100;

  let html = `<div class="result">
    <div class="emoji">${t.emoji}</div>`;

  if (passed){
    html += `<h2>特訓クリア！</h2>
      <div class="title-badge">${t.name}</div>`;
  } else {
    html += `<h2>もう少し！</h2>
      <div class="title-badge" style="background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:0 8px 24px rgba(100,116,139,.34);">${t.name}</div>`;
  }

  html += `<p class="sub">${t.msg}</p>`;

  html += `<div class="ring">
    <svg width="180" height="180">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="#eef2ff" stroke-width="15"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="url(#gr)" stroke-width="15"
        stroke-linecap="round" stroke-dasharray="${dash} ${C - dash}"/>
      <defs>
        <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="inner">
      <div class="bignum">${score}<small>/${TOTAL_Q}</small></div>
      <div style="font-size:13px;color:#94a3b8;margin-top:4px;">正答率 ${rate}%</div>
    </div>
  </div>`;

  if (wrongList.length){
    html += `<div class="review">
      <h3>📝 間違えた問題</h3>
      ${wrongList.map(w => `
        <div class="item">
          <span class="tag">Q${w.idx}</span>
          <span><b style="color:#4f46e5;">${w.jp}</b>
            <span style="color:#94a3b8;">（${w.cn}）</span></span>
        </div>`).join('')}
    </div>`;
  } else {
    html += `<div class="review" style="text-align:center;">
      <h3 style="margin-bottom:0;">✨ 全問正解！完璧です！</h3>
    </div>`;
  }

  html += `<div class="again-row">
    <button class="again" id="againBtn">🔄 もう一度挑戦</button>
    <button class="again home" id="homeBtn">🏠 ホームに戻る</button>
  </div></div>`;

  $('resultCard').innerHTML = html;
  $('againBtn').addEventListener('click', () => startQuizFromPool(currentPool));
  $('homeBtn').addEventListener('click', () => showView('start'));

  showView('result');

  if (passed) setTimeout(confetti, 180);
}

/* =====================================================================
   彩带
   ===================================================================== */
function confetti(){
  const cv = $('confetti');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  cv.style.display = 'block';
  const ctx = cv.getContext('2d');
  const colors = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6','#f43f5e','#8b5cf6','#fbbf24'];
  const parts = [];
  for (let i = 0; i < 200; i++){
    parts.push({
      x: Math.random() * cv.width,
      y: Math.random() * cv.height * 0.6 - cv.height,
      w: 6 + Math.random() * 9,
      h: 4 + Math.random() * 7,
      vx: (Math.random() - 0.5) * 3.2,
      vy: 2 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.22,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  let t = 0;
  (function loop(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    t++;
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.07;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - t / 340);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t < 340) requestAnimationFrame(loop);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  })();
}

/* =====================================================================
   启动
   ===================================================================== */
function startQuizFromPool(pool){
  currentPool = pool;
  TOTAL_Q = Math.min(10, pool.length);
  PASS = Math.ceil(TOTAL_Q * 0.7);
  quiz = buildQuiz(pool, TOTAL_Q);
  curIdx = 0;
  score = 0;
  wrongList = [];
  $('scoreNum').textContent = '0';
  showView('quiz');
  renderQuestion();
}

function startAll(){
  startQuizFromPool(DB);
}

function startBasic(){
  const basicPool = DB.filter(m => m.level === 'basic');
  startQuizFromPool(basicPool);
}

function enterBrowseView(){
  browseMode = 'view';
  renderBrowse();
  showView('browse');
}

function enterBrowseSelect(){
  browseMode = 'select';
  selectedIndices.clear();
  renderBrowse();
  showView('browse');
}

$('startAllBtn').addEventListener('click', startAll);
$('startBasicBtn').addEventListener('click', startBasic);
$('selectRangeBtn').addEventListener('click', enterBrowseSelect);
$('browseBtn').addEventListener('click', enterBrowseView);
$('browseBackBtn').addEventListener('click', () => showView('start'));
$('backBtn').addEventListener('click', () => showView('start'));

document.addEventListener('keydown', e => {
  if (!$('v-quiz').classList.contains('active')) return;
  const q = quiz[curIdx];
  if (!q || answered) return;

  if (/^[1-8]$/.test(e.key)){
    const idx = parseInt(e.key, 10) - 1;
    const btns = document.querySelectorAll('#optBox > button');
    if (btns[idx]){ e.preventDefault(); btns[idx].click(); }
    return;
  }
  if (e.key === 'Enter' || e.key === ' '){
    const nb = $('nextBtn');
    if (nb){ e.preventDefault(); nb.click(); }
  }
});

$('dbCount').textContent = DB.length;
$('basicCount').textContent = DB.filter(m => m.level === 'basic').length;
</script>
